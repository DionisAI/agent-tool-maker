name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Health-contract tests import Playwright metadata; browser binaries run only below.
      # Passkey contract tests run the maintained WebAuthn verifier, not only the mock.
      - run: python -m pip install -e '.[secure,test,browser-test,passkey]'
      - run: python -m pytest -q -m 'not browser and not integration' --junitxml=reports/contracts.xml
      - run: python scripts/check_test_receipt.py reports/contracts.xml
  node-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Reviewed OpenCLI adapters/runtimes against synthetic pages; no install, login or provider calls.
      - run: mkdir -p reports
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/node.xml tests/*.test.mjs
      - run: python scripts/check_test_receipt.py reports/node.xml
  local-tools:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: brew install ffmpeg imagemagick pandoc
      - run: python -m pip install -e '.[secure,test]'
      - run: python -m pytest -q -m 'integration and not browser' --junitxml=reports/local-tools.xml
      - run: python scripts/check_test_receipt.py reports/local-tools.xml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,browser-test,passkey]'
      - run: python -m playwright install --with-deps chromium
      - name: Select actual Playwright browser
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('ATM_CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - run: python -m pytest -q -m browser --junitxml=reports/browser.xml
      - run: python scripts/check_test_receipt.py reports/browser.xml
      - name: Native loopback browser acceptance
        run: python -m pytest -q acceptance/test_console_navigation.py acceptance/test_recipe_native_v06.py acceptance/test_quickstart_native_v08.py --junitxml=reports/console-native.xml
      - run: python scripts/check_test_receipt.py reports/console-native.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-receipts
          path: reports/*.xml
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install dist/*.whl
      - name: Outside-source package smoke
        working-directory: ${{ runner.temp }}
        run: |
          atm --version
          atm --home "$RUNNER_TEMP/atm-state" init
          atm --home "$RUNNER_TEMP/atm-state" setup
          atm --home "$RUNNER_TEMP/atm-state" agents list
          atm --home "$RUNNER_TEMP/atm-state" tools list fal
          atm ui --help
          atm sync --help
          atm access --help
          atm broker --help
          atm --home "$RUNNER_TEMP/atm-state" doctor --tool ffmpeg.probe

  linux-broker-uid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # A second OS user must import installed package files, not the runner's private checkout.
      - run: python -m pip install '.[test]'
      - name: Explicit cross-UID acceptance in isolated runner
        run: sudo "$(command -v python)" -m pytest -q acceptance/test_broker_uid.py --junitxml=reports/broker-uid.xml
      - run: python scripts/check_test_receipt.py reports/broker-uid.xml

  secrets-first-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - name: One password, independent clients, no manifest, fake credentials only
        run: python scripts/demo_secrets_first.py --out reports/secrets-first.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-first-receipt
          path: reports/secrets-first.json
